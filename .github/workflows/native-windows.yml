name: Native Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Actual portable catalog workspace
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Select current Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install unchanged source lock and isolated desktop lock
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/node_modules/electron/install.js
          exit $LASTEXITCODE
      - name: Check actual file transactions and static NTFS aliases
        run: pnpm test
      - name: Audit the full desktop dependency graph
        run: npm audit --prefix desktop --audit-level moderate
      - name: Build exact clean-source portable app
        run: node tools/package-native.mjs release/ci-portable
      - name: Use real compiled widgets, revisions, restart and retained Quit
        shell: pwsh
        run: |
          $archive = 'release/ci-portable/KnowledgePortal-0.2.0-windows-x64.zip'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = (Get-Content -LiteralPath ($archive + '.sha256') -Raw).Trim()
          if ($sidecar -cne ($actual + '  KnowledgePortal-0.2.0-windows-x64.zip')) { throw 'Archive checksum differs' }
          if (Test-Path -LiteralPath '.runtime/relocated-portable') { throw 'Fresh relocated package required' }
          Expand-Archive -LiteralPath $archive -DestinationPath '.runtime/relocated-portable'
          node desktop/tests/native-acceptance.mjs .runtime/ci-acceptance .runtime/relocated-portable/KnowledgePortal.exe
          exit $LASTEXITCODE
      - name: Retain small synthetic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-workspace-evidence
          retention-days: 3
          if-no-files-found: warn
          path: |
            release/ci-portable/build-receipt.json
            .runtime/ci-acceptance/acceptance.json
            .runtime/ci-acceptance/failure.json
            .runtime/ci-acceptance/native-*.png
